<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/52ff4c741b.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="separador">
        <header>
            <h1>Minhas Tarefas</h1>
            <p>Gerencie suas tarefas de forma simples e intuitiva</p>
        </header>
        <main>
            <section id="adicionar-tarefa">
                <p>Adicionar tarefa: <input type="text" placeholder="Digite o nome da tarefa" id="iadd-tarefa" name="add-tarefa"> <button id="btn-adicionar-tarefa">Adicionar</button></p>
                <div id="add-tarefa-response">
                    <!--Responde se a tarefa foi adicionada-->
                </div>
            </section>
            <section id="campo-tarefas">
                <p>Pesquisar por tarefa: <input type="text" placeholder="Digite o nome da tarefa" id="ipesquisar-tarefa" name="pesquisar-tarefa"></p>
                <p id="filtrar-tarefa">Filtrar tarefas: 
                    <select name="filtro" id="ifiltro">
                        <option value="Todas">Todas</option>
                        <option value="false">Em andameneto</option>
                        <option value="true">Finalizadas</option>
                    </select>
                </p>
                <button id="btn-excluir">Excluir todas as tarefas</button>
                <div id="lista-tarefas">
                    <!--Área que lista as tarefas-->
                </div>
                <div id="status-tarefas">
                    <!--Mostra quantas tarefas foram concluídas-->
                    Tarefas concluídas: 0/0
                </div>
            </section>
        </main>
    </div>
    <footer>
        <p>&copy; Site desenvolvido por: <a href="https://github.com/pedrogiacciani" target="_blank">Pedro Giacciani</a></p>
    </footer>
    <dialog id="menu-flutuante">
        <div>
            <p id="excluir">Excluir tarefa <i class="fa-solid fa-trash"></i></p>
            <p id="editar">Editar tarefa <i class="fa-solid fa-pencil"></i></p>
        </div>
    </dialog>
    <dialog id="info">
        <p id="texto-info">Criado em:  </p>
    </dialog>
    <script src="scripts/app.js" type="module"></script>
</body>
</html>
